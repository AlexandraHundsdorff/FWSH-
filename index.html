<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FKS Feuerwehr Lernen</title><style>body{font-family:system-ui,sans-serif;background:#f6f7f9;color:#17212b;margin:0;padding:22px}main{max-width:620px;margin:auto}h1{font-size:1.7rem}button{border:0;border-radius:12px;background:#b71c1c;color:white;padding:13px 18px;margin:5px;font-size:1rem;cursor:pointer}.secondary{background:#3e5269}.card{background:white;border-radius:16px;padding:24px;margin-top:20px;box-shadow:0 2px 14px #0001;min-height:220px;text-align:center}.symbol{width:min(100%,350px);height:230px;object-fit:contain;image-rendering:auto}.answer{font-size:1.25rem;white-space:normal}canvas{background:white;border:1px solid #9ca3af;border-radius:10px;touch-action:none;width:100%;height:260px}#info{color:#52606d}</style><main><h1>🚒 FKS Feuerwehr-Lern-App</h1><p>Wähle eine Übung:</p><nav><button onclick="mode('symbol')">Symbol – ohne Namen</button><button onclick="mode('name')">Name – ohne Symbol</button><button onclick="mode('draw')">Selbst zeichnen – nur Name</button></nav><p id="info">Die Symbole stammen aus der FKS-Faltkarte 11/2022.</p><div class="card" id="card">Wähle oben eine Übung.</div><div id="controls"></div></main><script>let data=[],current=null,kind='symbol',shown=false;fetch('daten.json').then(r=>r.json()).then(d=>{data=d;document.getElementById('info').textContent=d.length+' Übungskarten geladen · FKS 11/2022'}).catch(()=>document.getElementById('info').textContent='Daten konnten nicht geladen werden.');function mode(m){kind=m;next()}function next(){if(!data.length)return;current=data[Math.floor(Math.random()*data.length)];shown=false;render()}function render(){let c=document.getElementById('card'),b=document.getElementById('controls');if(!current)return;c.innerHTML=kind==='symbol'?'<img class="symbol" src="'+current.bild+'" alt="FKS-Symbol">':kind==='name'?'<p class="answer">'+esc(current.name)+'</p>':'<p class="answer">'+esc(current.name)+'</p><canvas id="draw" width="600" height="260"></canvas>';b.innerHTML='<button class="secondary" onclick="reveal()">Lösung zeigen</button><button onclick="next()">Nächstes</button>'+(kind==='draw'?'<button class="secondary" onclick="clearDraw()">Zeichnung löschen</button>':'');if(kind==='draw')setupDraw()}function esc(t){return t.replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}function reveal(){if(!current||shown)return;shown=true;let d=document.createElement('div');d.style.marginTop='18px';d.innerHTML=kind==='symbol'?'<strong>'+esc(current.name)+'</strong>':'<img class="symbol" src="'+current.bild+'" alt="Lösung">';document.getElementById('card').appendChild(d)}function clearDraw(){let c=document.getElementById('draw');if(c)c.getContext('2d').clearRect(0,0,c.width,c.height)}function setupDraw(){let c=document.getElementById('draw'),ctx=c.getContext('2d'),on=false;function pos(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}c.onpointerdown=e=>{on=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...pos(e))};c.onpointermove=e=>{if(on){ctx.lineWidth=3;ctx.lineCap='round';ctx.lineTo(...pos(e));ctx.stroke()}};c.onpointerup=()=>on=false;c.onpointercancel=()=>on=false}</script></html>
