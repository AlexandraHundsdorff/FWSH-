[i],order[j]]=[order[j],order[i]];}pos=-1;}function img(it){const el=document.createElement('img');el.src=it.file;el.className='symbol';el.alt='FKS-Symbol';return el;}function name(it){const el=document.createElement('div');el.className='name';el.textContent=it.name;return el;}function render(){let it=items[order[pos]],m=mode.value;q.replaceChildren();a.replaceChildren();a.hidden=true;if(m==='symbol'){q.append(img(it));a.append(name(it));}else{q.append(name(it));a.append(img(it));}status.textContent='Symbol '+(pos+1)+' von '+items.length;progress.textContent='Gewusst: '+correct+' · Noch üben: '+wrong;}function next(){if(pos+1>=order.length)shuffle();pos++;render();}document.getElementById('next').onclick=next;document.getElementById('reveal').onclick=()=>a.hidden=false;document.getElementById('right').onclick=()=>{correct++;next();};document.getElementById('wrong').onclick=()=>{wrong++;next();};mode.onchange=()=>{shuffle();next();};shuffle();next();</script></body></html>
