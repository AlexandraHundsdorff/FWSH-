<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#10243a"><title>FKS Symbole lernen</title><style>body{font-family:system-ui,Arial;background:#10243a;color:white;margin:0;padding:18px;text-align:center}main{max-width:600px;margin:auto}h1{font-size:1.7rem}button,select{font:inherit;border:0;border-radius:13px;padding:14px 18px;margin:5px;cursor:pointer}button{background:#e6f0f8;color:#10243a}button.primary{background:#ffbf3c;font-weight:700}.card{background:white;color:#17283d;border-radius:20px;min-height:245px;padding:24px 12px;margin:18px 0;display:flex;align-items:center;justify-content:center;flex-direction:column}.card img{max-width:95%;max-height:190px;object-fit:contain;image-rendering:auto}.card .name{font-size:1.6rem;font-weight:700}.hint{color:#b9cbd8}.hidden{display:none}.modes button.active{background:#ffbf3c;font-weight:bold}.stats{margin:12px;color:#b9cbd8}.answer{margin:12px;font-size:1.25rem;font-weight:bold}footer{font-size:.8rem;color:#b9cbd8;margin-top:25px}</style></head><body><main><h1>🚒 FKS-Symbole lernen</h1><p class="hint">Originalabbildungen aus der FKS-Faltkarte 11/2022</p><div class="modes"><button onclick="setMode('symbol')" id="symbol">👀 Symbol</button><button onclick="setMode('name')" id="name">🧠 Name</button><button onclick="setMode('draw')" id="draw">✏️ Zeichnen</button></div><div class="stats" id="stats"></div><div class="card" id="card"></div><div id="answer" class="answer hidden"></div><button class="primary" onclick="reveal()" id="reveal">Lösung anzeigen</button><div id="grading" class="hidden"><button onclick="grade(false)">❌ Noch üben</button><button onclick="grade(true)">✅ Gewusst</button></div><p><button onclick="next()">➡️ Nächstes Symbol</button></p><p><button onclick="mistakesOnly()" id="mistakes">🔁 Fehler wiederholen</button></p><footer>Die Bewertung wird nur auf diesem Gerät gespeichert. Keine offizielle FKS-App.</footer></main><script>const data=[{"name": "Rettungen (Mensch/Tier)", "img": "symbole/s001.png"}, {"name": "Feuer/Brandherd", "img": "symbole/s002.png"}, {"name": "Unfall", "img": "symbole/s003.png"}, {"name": "Gefährliche Stoffe", "img": "symbole/s004.png"}, {"name": "Wasser", "img": "symbole/s005.png"}, {"name": "Rauch", "img": "symbole/s006.png"}, {"name": "Horizontale Entwicklung", "img": "symbole/s007.png"}, {"name": "Entwicklungsgrenze", "img": "symbole/s008.png"}, {"name": "Vertikale Entwicklung", "img": "symbole/s009.png"}, {"name": "Umfassungswände", "img": "symbole/s010.png"}, {"name": "Anzahl Geschosse", "img": "symbole/s011.png"}, {"name": "Brandabschnittsbildende Wand EI 30", "img": "symbole/s012.png"}, {"name": "Brandabschnittsbildende Wand EI 60", "img": "symbole/s013.png"}, {"name": "Brandabschnittsbildende Wand EI 180", "img": "symbole/s014.png"}, {"name": "Brandschutztüren", "img": "symbole/s015.png"}, {"name": "Eingang / Durchgang", "img": "symbole/s016.png"}, {"name": "Treppen", "img": "symbole/s017.png"}, {"name": "Schieber", "img": "symbole/s018.png"}, {"name": "Elektrotableau", "img": "symbole/s019.png"}, {"name": "Kamin", "img": "symbole/s020.png"}, {"name": "Rauch- und Wärmeabzug", "img": "symbole/s021.png"}, {"name": "Aufzug/Lift", "img": "symbole/s022.png"}, {"name": "Sprinklerzentrale", "img": "symbole/s023.png"}, {"name": "Brandmeldezentrale", "img": "symbole/s024.png"}, {"name": "Fernsignaltableau", "img": "symbole/s025.png"}, {"name": "Schlüsseldepot", "img": "symbole/s026.png"}, {"name": "Nordrichtung", "img": "symbole/s027.png"}, {"name": "Windrichtung", "img": "symbole/s028.png"}, {"name": "Massstab", "img": "symbole/s029.png"}, {"name": "Strasse", "img": "symbole/s030.png"}, {"name": "Anfahrt der Feuerwehr", "img": "symbole/s031.png"}, {"name": "Brücke", "img": "symbole/s032.png"}, {"name": "Bahnlinie mit Strassen-Niveauübergang", "img": "symbole/s033.png"}, {"name": "Bahnlinie mit Strassenüberführung", "img": "symbole/s034.png" '{}')}catch(e){}function save(){localStorage.setItem('fksProgress',JSON.stringify(progress))}function setMode(m){mode=m;for(const b of document.querySelectorAll('.modes button'))b.classList.toggle('active',b.id===m);show()}function pool(){let arr=data.map((_,i)=>i);if(repeat){arr=arr.filter(i=>progress[i]===false);if(!arr.length){repeat=false;alert('Noch keine Fehler gespeichert.')}}return arr.length?arr:data.map((_,i)=>i)}function next(){let a=pool();let other=a.filter(i=>i!==current);current=(other.length?other:a)[Math.floor(Math.random()*(other.length?other:a).length)];show()}function show(){let d=data[current];document.getElementById('card').innerHTML=mode==='symbol'?`<img alt="FKS-Symbol ohne Namen" src="${d.img}">`:`<div class="name">${d.name}</div>`;document.getElementById('answer').classList.add('hidden');document.getElementById('grading').classList.add('hidden');document.getElementById('reveal').classList.remove('hidden');document.getElementById('answer').innerHTML=mode==='symbol'?d.name:`<img src="${d.img}" alt="Originalsymbol" style="max-width:210px;max-height:130px;background:white;padding:12px;border-radius:12px">`;stats()}function reveal(){document.getElementById('answer').classList.remove('hidden');document.getElementById('grading').classList.remove('hidden');document.getElementById('reveal').classList.add('hidden')}function grade(ok){progress[current]=ok;save();next()}function mistakesOnly(){repeat=!repeat;document.getElementById('mistakes').textContent=repeat?'🔁 Alle Symbole üben':'🔁 Fehler wiederholen';next()}function stats(){let known=Object.values(progress).filter(v=>v===true).length;let wrong=Object.values(progress).filter(v=>v===false).length;document.getElementById('stats').textContent=`${data.length} Symbole · ${known} gewusst · ${wrong} noch üben${repeat?' · Fehlertraining':''}`}setMode('symbol');</script></body></html>
